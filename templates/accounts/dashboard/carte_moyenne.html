<div class="bg-gradient-to-br from-purple-600 to-purple-700 rounded-2xl p-6 text-white shadow-lg shadow-purple-500/20 card-hover">
    <div class="flex items-center justify-between mb-4">
        <span class="text-purple-200 text-sm font-medium">{{ titre }}</span>
        <span class="material-symbols-outlined text-purple-200 fill">{{ icone }}</span>
    </div>
    <div class="flex items-end gap-2">
        <span class="text-4xl font-bold">
            {% if moyenne_generale is not None %}
                {{ moyenne_generale|floatformat:1 }}
            {% else %}
                —
            {% endif %}
        </span>
        <span class="text-purple-200 text-sm mb-1">/20</span>
    </div>
    {% if moyenne_generale is not None %}
    <div class="mt-3 h-2 bg-purple-500/40 rounded-full overflow-hidden">
        <div class="h-full bg-white rounded-full progress-animated" style="width:{% widthratio moyenne_generale 20 100 %}%"></div>
    </div>
    {% endif %}
</div>
