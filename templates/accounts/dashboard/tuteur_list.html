<div class="bg-white rounded-2xl border border-slate-200 shadow-sm fade-in">
    <div class="px-6 py-4 border-b border-slate-100">
        <h3 class="font-semibold text-slate-800 flex items-center gap-2">
            <span class="material-symbols-outlined text-purple-500">group</span>
            Mes étudiants parrainés
        </h3>
    </div>
    {% if etudiants %}
    <div class="divide-y divide-slate-50">
        {% for etu in etudiants %}
        <div class="px-6 py-4 flex items-center justify-between hover:bg-slate-50 transition-colors card-hover">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 to-purple-600 flex items-center justify-center text-white font-bold text-sm shadow-sm">
                    {{ etu.username|first|upper }}
                </div>
                <div>
                    <p class="font-medium text-slate-800">{{ etu.username }}</p>
                    <p class="text-xs text-slate-400">Étudiant</p>
                </div>
            </div>
            <a href="{% url 'dashboard_tuteur' etu.id %}" class="inline-flex items-center gap-1.5 px-4 py-2 text-sm font-medium text-purple-600 bg-purple-50 rounded-xl hover:bg-purple-100 hover:shadow-sm transition-all">
                <span class="material-symbols-outlined text-lg">visibility</span>
                Voir le dashboard
            </a>
        </div>
        {% endfor %}
    </div>
    {% else %}
    <div class="text-center py-12 text-slate-400">
        <span class="material-symbols-outlined text-5xl mb-3 block text-slate-300">group_off</span>
        <p class="font-medium">Aucun étudiant ne vous est attribué.</p>
    </div>
    {% endif %}
</div>
